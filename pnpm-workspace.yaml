packages:
  - apps/*
  - packages/*

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64

onlyBuiltDependencies:
  - electron-winstaller
  - esbuild
  - msw
  - sharp
  - node-pty

allowBuilds:
  electron-winstaller: true
  esbuild: true
  msw: true
  sharp: true
  node-pty: true

overrides:
  # tldraw pulls this in; keep it on the workspace's @tiptap/core version.
  "@tiptap/extension-highlight": 3.20.0

packages:
  - apps/*
  - packages/*

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64

onlyBuiltDependencies:
  - electron-winstaller
  - esbuild
  - msw
  - sharp
  - node-pty

allowBuilds:
  electron-winstaller: true
  esbuild: true
  msw: true
  sharp: true
  node-pty: true

patchedDependencies:
  keymatch@1.0.5: patches/keymatch@1.0.5.patch

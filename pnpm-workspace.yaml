packages:
  - apps/*
  - packages/*

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64

onlyBuiltDependencies:
  - electron-winstaller
  - esbuild
  - msw
  - sharp
  - node-pty
  - native-keymap

allowBuilds:
  electron-winstaller: true
  esbuild: true
  msw: true
  sharp: true
  node-pty: true
  native-keymap: true

patchedDependencies:
  keymatch@1.0.5: patches/keymatch@1.0.5.patch


overrides:
  # tldraw pulls this in; keep it on the workspace's @tiptap/core version.
  "@tiptap/extension-highlight": 3.20.0

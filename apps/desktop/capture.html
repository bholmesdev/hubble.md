<!doctype html>
<html lang="en" data-capture-window>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capture</title>
    <script>
      // The panel appears over whatever you were doing, so it must never flash
      // the wrong theme on the way in.
      try {
        if (matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/capture/main.tsx"></script>
  </body>
</html>
